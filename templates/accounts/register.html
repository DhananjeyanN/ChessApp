{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class = 'reg-form'>
    <h1>Register</h1>
    <form method="post" action="{% url 'register' %}" class="form-group" style="color:gold;">
        {% csrf_token %}
        {% crispy form %}
        <div class = 'form-field'>
            <input type = 'submit' value = 'submit'>
        </div>
    </form>
</div>
{% endblock %}
