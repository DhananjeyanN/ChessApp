{% extends 'base.html' %}
{% block content %}
<h1 style="color:gold;">Home</h1>
{% if request.user.is_authenticated %}
<button id="join-game" style="display: none">Join Game</button>
<button id="leave-game" style="display: none">Leave Game</button>
<button id="prev-game" style="display: none">Join Previous Game</button>

{% endif %}
{% endblock %}
